version: '3.8'

services:
  traffic-detection:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-detection-system
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=false
      - YOLO_MODEL=yolov8n.pt
      - YOLO_CONFIDENCE=0.5
      - GESTURE_CONFIDENCE=0.7
      - USE_GPU=true
      - PARALLEL_PROCESSING=true
      - ENABLE_PERFORMANCE_MONITORING=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # For camera access on Linux
      - /dev:/dev
    devices:
      # Allow access to camera devices
      - /dev/video0:/dev/video0
    restart: unless-stopped
    networks:
      - traffic-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: traffic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - traffic-net
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:latest
    container_name: traffic-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - traffic-net

  grafana:
    image: grafana/grafana:latest
    container_name: traffic-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - traffic-net
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    container_name: traffic-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    restart: unless-stopped
    networks:
      - traffic-net
    depends_on:
      - traffic-detection

networks:
  traffic-net:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data: